<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Brief</title>
  <meta name="description" content="Short, punchy AI news digests" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Newsletter</p>
      <h1 id="site-title">AI Brief</h1>
      <p id="tagline" class="tagline">Short, punchy AI news digests</p>
    </header>
    <section id="digests" aria-live="polite">
      <p class="loading">Loading digests…</p>
    </section>
    <footer>
      <p>Updated digests live in <code>digests.json</code>. Built for easy reading on phone or desktop.</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
